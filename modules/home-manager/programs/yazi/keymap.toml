# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
prepend_keymap = [
  { on = "<A-c>", run = "close", desc = "Close the current tab, or quit if it's last" },

  # Tabs
  { on = "<A-s>", run = "tab_create --current", desc = "Create a new tab with CWD" },
  { on = "<A-j>", run = "tab_switch -1 --relative", desc = "Switch to the previous tab" },
  { on = "<A-k>", run = "tab_switch 1 --relative", desc = "Switch to the next tab" },

  { on = "{", run = "tab_swap -1", desc = "Swap current tab with previous tab" },
  { on = "}", run = "tab_swap 1", desc = "Swap current tab with next tab" },

  # Find
  { on = "+", run = "find --smart", desc = "Find next file" },
  { on = "-", run = "find --previous --smart", desc = "Find previous file" },

  # Seeking
  { on = "<C-j>", run = "seek 5", desc = "Seek down 5 units in the preview" },
  { on = "<C-k>", run = "seek -5", desc = "Seek up 5 units in the preview" },

  # Goto
  { on = "i", run = "cd --interactive", desc = "Jump interactively" },

  # Operation
  { on = "p", run = "paste", desc = "Paste yanked files" },
  { on = "<C-p>", run = "paste --force", desc = "Paste yanked files (overwrite if the destination exists)" },

  # Smart paste: `paste` files without entering the directory
  { on = "P", run = "plugin smart-paste", desc = "Paste into the hovered directory or CWD" },

  # Dropping to the shell
  { on = "<C-s>", run = 'shell "$SHELL" --block', desc = "Open shell here" },
  # Smart enter: `enter` for directory, `open` for file
  { on = "l", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },

  # Copy selected files to the system clipboard while yanking
  { on = "y", run = [
    "yank",
    '''shell 'echo "$@" | xclip -i -selection clipboard -t text/uri-list' ''',
  ] },

  # Vim-like `f<char>`, jump to the next file whose name starts with `<char>`
  { on = "F", run = "plugin jump-to-char", desc = "Jump to char" },

  # Maximize or restore the preview pane.
  { on = "T", run = "plugin max-preview", desc = "Maximize or restore preview" },

  # Switch the preview pane between hidden and shown
  { on = "H", run = "plugin hide-preview", desc = "Hide or show preview" },

  # Make filters smarter: continuous filtering, automatically enter unique directory, open file on submitting
  { on = "f", run = "plugin smart-filter", desc = "Smart filter" },

  # dedukun/bookmarks.yazi
  { on = "m", run = "plugin bookmarks save", desc = "Save current position as a bookmark" },
  { on = "'", run = "plugin bookmarks jump", desc = "Jump to a bookmark" },
  { on = [
    "b",
    "d",
  ], run = "plugin bookmarks delete", desc = "Delete a bookmark" },
  { on = [
    "b",
    "D",
  ], run = "plugin bookmarks delete_all", desc = "Delete all bookmarks" },

  # TODO:
  # Sonico98/mkdir.yazi
  # { on = "A", run = "plugin mkdir", desc = "Create a directory" },

  # KKV9/compress.yazi
  { on = [
    "c",
    "a",
  ], run = "plugin compress", desc = "Archive selected files" },

  # uhs-robert/recycle-bin.yazi
  { on = [
    "R",
    "b",
  ], run = "plugin recycle-bin", desc = "Open Recycle Bin menu" },
]

[help]
prepend_keymap = [
  # Filtering
  { on = "/", run = "filter", desc = "Apply a filter for the help items" },
]
